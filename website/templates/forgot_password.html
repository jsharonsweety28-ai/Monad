{% extends "base.html" %}
{% block title %}Forgot Password · monad{% endblock %}
{% block content %}

<style>
  :root {
    --bg: #FFFDF9; --card: #FDF6F0; --accent: #E07B39; --accent2: #F5A623;
    --text: #2D2A26; --muted: #8B7E74; --border: #F0E8DF; --white: #FFFFFF; --hover: #FEF3E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .auth-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(170deg, #FDF6F0 0%, #FFFDF9 40%, #FDF6F0 100%);
    position: relative; overflow: hidden;
  }
  .auth-page::before {
    content: ''; position: absolute; width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(224,123,57,0.05) 0%, transparent 70%);
    bottom: -200px; left: -200px; border-radius: 50%;
  }
  .auth-page::after {
    content: ''; position: absolute; width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(245,166,35,0.04) 0%, transparent 70%);
    top: -150px; right: -150px; border-radius: 50%;
  }

  .auth-card {
    background: var(--white); border-radius: 24px; padding: 48px 40px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03);
    border: 1px solid var(--border); position: relative; z-index: 1;
    animation: slideUp 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-icon {
    width: 56px; height: 56px; border-radius: 16px; background: var(--hover);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px; font-size: 24px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }

  .auth-card h2 {
    font-size: 24px; font-weight: 750; color: var(--text);
    text-align: center; margin-bottom: 6px; letter-spacing: -0.5px;
  }
  .subtitle {
    text-align: center; color: var(--muted); font-size: 0.9rem;
    margin-bottom: 28px; line-height: 1.5;
  }

  .input-group { margin-bottom: 20px; position: relative; }
  .input-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px; z-index: 1;
  }
  .input-group input {
    width: 100%; padding: 15px 16px 15px 48px;
    border: 2px solid var(--border); border-radius: 14px; font-size: 0.95rem;
    transition: all 0.3s ease; background: var(--card); color: var(--text);
    font-weight: 500; font-family: 'Inter', sans-serif; outline: none;
  }
  .input-group input:focus {
    border-color: var(--accent); background: var(--white);
    box-shadow: 0 0 0 4px rgba(224,123,57,0.08);
  }
  .input-group input::placeholder { color: #c4b8a8; font-weight: 400; }

  .btn-primary {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; border-radius: 14px;
    font-size: 1rem; font-weight: 650; cursor: pointer;
    transition: all 0.3s ease; margin-top: 4px;
    box-shadow: 0 6px 20px rgba(224,123,57,0.25);
    letter-spacing: 0.3px; font-family: 'Inter', sans-serif;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(224,123,57,0.35); }
  .btn-primary:active { transform: translateY(0); }

  .back-link {
    display: block; text-align: center; margin-top: 20px;
    font-size: 0.85rem; color: var(--muted); text-decoration: none; transition: color .2s;
  }
  .back-link:hover { color: var(--text); }

  @media (max-width: 480px) { .auth-card { padding: 32px 20px; } }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">🔑</div>
    <h2>Forgot your password?</h2>
    <p class="subtitle">Enter your email and we'll send a verification code to reset it.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" name="email" placeholder="Your registered email" required autofocus>
      </div>
      <button type="submit" class="btn-primary">Send reset code ✦</button>
    </form>

    <a class="back-link" href="{{ url_for('auth.login') }}">← Back to sign in</a>
  </div>
</div>

{% endblock %}
