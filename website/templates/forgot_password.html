{% extends "base.html" %}
{% block title %}Forgot Password · monad{% endblock %}
{% block content %}

<style>
  :root {
    --bg: #FFFDF9; --card: #FDF6F0; --accent: #E07B39; --accent2: #F5A623;
    --text: #2D2A26; --muted: #8B7E74; --border: #F0E8DF; --white: #FFFFFF; --hover: #FEF3E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .auth-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: var(--bg);
  }

  .auth-card {
    background: var(--white);
    border: 3px solid var(--text); border-radius: 8px; padding: 44px 40px;
    width: 100%; max-width: 440px;
    box-shadow: 6px 6px 0 var(--text);
    position: relative; z-index: 1;
    animation: slideUp 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-icon {
    width: 52px; height: 52px; border-radius: 8px; background: var(--hover);
    border: 3px solid var(--text);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px; font-size: 22px;
    box-shadow: 3px 3px 0 var(--text);
  }

  .auth-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px; font-weight: 800; color: var(--text);
    text-align: center; margin-bottom: 6px; letter-spacing: -0.5px;
    text-transform: uppercase;
  }
  .subtitle {
    text-align: center; color: var(--muted); font-size: 0.9rem;
    margin-bottom: 28px; line-height: 1.5;
  }

  .input-group { margin-bottom: 20px; position: relative; }
  .input-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px; z-index: 1;
  }
  .input-group input {
    width: 100%; padding: 13px 16px 13px 48px;
    border: 2px solid var(--text); border-radius: 6px; font-size: 0.95rem;
    transition: box-shadow 0.15s; background: var(--bg); color: var(--text);
    font-weight: 500; font-family: 'Inter', sans-serif; outline: none;
  }
  .input-group input:focus {
    border-color: var(--accent);
    box-shadow: 3px 3px 0 var(--accent);
  }
  .input-group input::placeholder { color: #c4b8a8; font-weight: 400; }

  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--accent);
    color: white; border: 2px solid var(--text); border-radius: 6px;
    font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 4px;
    box-shadow: 4px 4px 0 var(--text);
    letter-spacing: 0.5px; font-family: 'Space Grotesk', sans-serif;
    text-transform: uppercase; transition: box-shadow 0.12s, transform 0.12s;
  }
  .btn-primary:hover { box-shadow: 2px 2px 0 var(--text); transform: translate(2px, 2px); }
  .btn-primary:active { box-shadow: none; transform: translate(4px, 4px); }

  .back-link {
    display: block; text-align: center; margin-top: 20px;
    font-size: 0.85rem; color: var(--muted); text-decoration: none; transition: color .2s;
  }
  .back-link:hover { color: var(--text); }

  @media (max-width: 480px) { .auth-card { padding: 32px 20px; } }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">🔑</div>
    <h2>Forgot your password?</h2>
    <p class="subtitle">Enter your email and we'll send a verification code to reset it.</p>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="input-group">
        <span class="input-icon">✉️</span>
        <input type="email" name="email" placeholder="Your registered email" required autofocus>
      </div>
      <button type="submit" class="btn-primary">Send reset code ✦</button>
    </form>

    <a class="back-link" href="{{ url_for('auth.login') }}">← Back to sign in</a>
  </div>
</div>

{% endblock %}
