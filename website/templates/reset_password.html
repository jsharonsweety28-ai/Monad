{% extends "base.html" %}
{% block title %}Reset Password · monad{% endblock %}
{% block content %}

<style>
  :root {
    --bg: #FFFDF9; --card: #FDF6F0; --accent: #E07B39; --accent2: #F5A623;
    --text: #2D2A26; --muted: #8B7E74; --border: #F0E8DF; --white: #FFFFFF; --hover: #FEF3E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .auth-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: var(--bg);
  }

  .auth-card {
    background: var(--white);
    border: 3px solid var(--text); border-radius: 8px; padding: 44px 40px;
    width: 100%; max-width: 440px;
    box-shadow: 6px 6px 0 var(--text);
    position: relative; z-index: 1;
    animation: slideUp 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-icon {
    width: 52px; height: 52px; border-radius: 8px; background: var(--hover);
    border: 3px solid var(--text);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px; font-size: 22px;
    box-shadow: 3px 3px 0 var(--text);
  }

  .auth-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px; font-weight: 800; color: var(--text);
    text-align: center; margin-bottom: 6px; letter-spacing: -0.5px;
    text-transform: uppercase;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; line-height: 1.5; }

  .input-group { margin-bottom: 16px; position: relative; }
  .input-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px; z-index: 1;
  }
  .input-group input {
    width: 100%; padding: 13px 48px 13px 48px;
    border: 2px solid var(--text); border-radius: 6px; font-size: 0.95rem;
    transition: box-shadow 0.15s; background: var(--bg); color: var(--text);
    font-weight: 500; font-family: 'Inter', sans-serif; outline: none;
  }
  .input-group input:focus {
    border-color: var(--accent);
    box-shadow: 3px 3px 0 var(--accent);
  }
  .input-group input::placeholder { color: #c4b8a8; font-weight: 400; }

  /* show/hide password toggle */
  .toggle-pw {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    cursor: pointer; font-size: 18px; user-select: none;
  }

  .password-hint { font-size: 0.78rem; color: var(--muted); margin: -8px 0 14px 4px; }

  /* strength bar */
  .strength-bar { height: 4px; border-radius: 4px; background: var(--border); margin: -4px 0 16px; overflow: hidden; }
  .strength-fill { height: 100%; width: 0; border-radius: 4px; transition: width .3s, background .3s; }

  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--accent);
    color: white; border: 2px solid var(--text); border-radius: 6px;
    font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 4px;
    box-shadow: 4px 4px 0 var(--text);
    letter-spacing: 0.5px; font-family: 'Space Grotesk', sans-serif;
    text-transform: uppercase; transition: box-shadow 0.12s, transform 0.12s;
  }
  .btn-primary:hover { box-shadow: 2px 2px 0 var(--text); transform: translate(2px, 2px); }
  .btn-primary:active { box-shadow: none; transform: translate(4px, 4px); }

  @media (max-width: 480px) { .auth-card { padding: 32px 20px; } }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">🛡️</div>
    <h2>Set a new password</h2>
    <p class="subtitle">Choose something strong that you haven't used before.</p>

    <form method="POST" action="{{ url_for('auth.reset_password') }}" id="resetForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="input-group">
        <span class="input-icon">🔐</span>
        <input type="password" id="pw" name="password" placeholder="New password" required autofocus>
        <span class="toggle-pw" onclick="togglePw('pw', this)">👁️</span>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="password-hint">✦ At least 7 characters with 1 special character</div>

      <div class="input-group">
        <span class="input-icon">🔐</span>
        <input type="password" id="pw2" name="confirm" placeholder="Confirm new password" required>
        <span class="toggle-pw" onclick="togglePw('pw2', this)">👁️</span>
      </div>
      <div id="matchHint" style="font-size:.78rem;margin:-4px 0 14px 4px;min-height:18px"></div>

      <button type="submit" class="btn-primary">Update password ✦</button>
    </form>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
}

const pw  = document.getElementById('pw');
const pw2 = document.getElementById('pw2');
const fill = document.getElementById('strengthFill');
const matchHint = document.getElementById('matchHint');

pw.addEventListener('input', () => {
  const v = pw.value;
  let score = 0;
  if (v.length >= 7) score++;
  if (v.length >= 12) score++;
  if (/[!@#$%^&*(),.?\":{}|<>]/.test(v)) score++;
  if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
  const colours = ['#ef4444','#f97316','#eab308','#22c55e'];
  fill.style.width  = (score * 25) + '%';
  fill.style.background = colours[score - 1] || '#F0E8DF';
  checkMatch();
});

pw2.addEventListener('input', checkMatch);

function checkMatch() {
  if (!pw2.value) { matchHint.textContent = ''; return; }
  if (pw.value === pw2.value) {
    matchHint.textContent = '✓ Passwords match';
    matchHint.style.color = '#22c55e';
  } else {
    matchHint.textContent = '✗ Passwords do not match';
    matchHint.style.color = '#ef4444';
  }
}
</script>

{% endblock %}
