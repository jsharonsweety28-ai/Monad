{% extends "base.html" %}
{% block title %}Verify Reset Code · monad{% endblock %}
{% block content %}

<style>
  :root {
    --bg: #FFFDF9; --card: #FDF6F0; --accent: #E07B39; --accent2: #F5A623;
    --text: #2D2A26; --muted: #8B7E74; --border: #F0E8DF; --white: #FFFFFF; --hover: #FEF3E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .auth-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: var(--bg);
  }

  .auth-card {
    background: var(--white);
    border: 3px solid var(--text); border-radius: 8px; padding: 44px 40px;
    width: 100%; max-width: 440px;
    box-shadow: 6px 6px 0 var(--text);
    position: relative; z-index: 1;
    animation: slideUp 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-icon {
    width: 52px; height: 52px; border-radius: 8px; background: var(--hover);
    border: 3px solid var(--text);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px; font-size: 22px;
    box-shadow: 3px 3px 0 var(--text);
  }

  .auth-card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px; font-weight: 800; color: var(--text);
    text-align: center; margin-bottom: 6px; letter-spacing: -0.5px;
    text-transform: uppercase;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; line-height: 1.5; }
  .email-chip { display: block; text-align: center; color: var(--accent); font-weight: 650; font-size: 0.9rem; margin-bottom: 28px; }

  .otp-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .otp-box {
    width: 52px; height: 60px; border: 2px solid var(--text); border-radius: 6px;
    background: var(--card); color: var(--text); font-size: 1.6rem; font-weight: 800;
    text-align: center; font-family: 'Inter', sans-serif;
    transition: border-color .2s, box-shadow .2s; outline: none; caret-color: var(--accent);
  }
  .otp-box:focus { border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent); }

  .btn-primary {
    width: 100%; padding: 14px;
    background: var(--accent);
    color: white; border: 2px solid var(--text); border-radius: 6px;
    font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px;
    box-shadow: 4px 4px 0 var(--text);
    letter-spacing: 0.5px; font-family: 'Space Grotesk', sans-serif;
    text-transform: uppercase; transition: box-shadow 0.12s, transform 0.12s;
  }
  .btn-primary:hover { box-shadow: 2px 2px 0 var(--text); transform: translate(2px, 2px); }
  .btn-primary:active { box-shadow: none; transform: translate(4px, 4px); }

  .resend-row { text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--muted); }
  .resend-row button {
    background: none; border: none; color: var(--accent); font-weight: 650;
    cursor: pointer; font-size: 0.88rem; font-family: 'Inter', sans-serif; padding: 0; transition: color .2s;
  }
  .resend-row button:hover { color: #c96a2e; }

  .back-link {
    display: block; text-align: center; margin-top: 16px;
    font-size: 0.85rem; color: var(--muted); text-decoration: none; transition: color .2s;
  }
  .back-link:hover { color: var(--text); }

  @media (max-width: 480px) {
    .auth-card { padding: 32px 20px; }
    .otp-box { width: 44px; height: 54px; font-size: 1.4rem; }
  }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">🔐</div>
    <h2>Enter your code</h2>
    <p class="subtitle">We sent a reset code to</p>
    <span class="email-chip">{{ email }}</span>

    <form method="POST" action="{{ url_for('auth.reset_verify') }}" id="otpForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="otp" id="otpHidden">

      <div class="otp-row">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="0" autocomplete="off">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="1" autocomplete="off">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="2" autocomplete="off">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="3" autocomplete="off">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="4" autocomplete="off">
        <input class="otp-box" type="text" inputmode="numeric" maxlength="1" data-index="5" autocomplete="off">
      </div>

      <button type="submit" class="btn-primary">Verify code ✦</button>
    </form>

    <div class="resend-row">
      Didn't get it?
      <span id="resendWrap" style="display:none">
        <form method="POST" action="{{ url_for('auth.resend_reset_otp') }}" style="display:inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Resend code</button>
        </form>
      </span>
      <span id="countdownWrap">Resend in <span id="countdown">60</span>s</span>
    </div>

    <a class="back-link" href="{{ url_for('auth.forgot_password') }}">← Use a different email</a>
  </div>
</div>

<script>
const boxes = document.querySelectorAll('.otp-box');

boxes.forEach((box, i) => {
  box.addEventListener('input', e => {
    const val = e.target.value.replace(/\D/g, '');
    e.target.value = val.slice(-1);
    if (val && i < boxes.length - 1) boxes[i + 1].focus();
    syncHidden();
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !box.value && i > 0) {
      boxes[i - 1].focus(); boxes[i - 1].value = ''; syncHidden();
    }
    if (e.key === 'ArrowLeft'  && i > 0)              boxes[i - 1].focus();
    if (e.key === 'ArrowRight' && i < boxes.length-1) boxes[i + 1].focus();
  });
  box.addEventListener('paste', e => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    digits.split('').forEach((d, j) => { if (boxes[j]) boxes[j].value = d; });
    if (boxes[digits.length - 1]) boxes[Math.min(digits.length, 5)].focus();
    syncHidden();
  });
});

function syncHidden() {
  document.getElementById('otpHidden').value = [...boxes].map(b => b.value).join('');
}

document.getElementById('otpForm').addEventListener('input', () => {
  if ([...boxes].every(b => b.value !== '')) { syncHidden(); document.getElementById('otpForm').submit(); }
});

let secs = 60;
const cd = document.getElementById('countdown');
const timer = setInterval(() => {
  secs--;
  cd.textContent = secs;
  if (secs <= 0) {
    clearInterval(timer);
    document.getElementById('countdownWrap').style.display = 'none';
    document.getElementById('resendWrap').style.display   = 'inline';
  }
}, 1000);
</script>

{% endblock %}
