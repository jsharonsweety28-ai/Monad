{% extends "base.html" %}
{% block title %}Complete Sign Up · monad{% endblock %}
{% block content %}

<style>
  :root {
    --bg: #FFFDF9; --card: #FDF6F0; --accent: #E07B39; --accent2: #F5A623;
    --text: #2D2A26; --muted: #8B7E74; --border: #F0E8DF; --white: #FFFFFF; --hover: #FEF3E8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .auth-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: linear-gradient(170deg, #FDF6F0 0%, #FFFDF9 40%, #FDF6F0 100%);
    position: relative; overflow: hidden;
  }
  .auth-page::before {
    content: ''; position: absolute; width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(224,123,57,0.05) 0%, transparent 70%);
    bottom: -200px; left: -200px; border-radius: 50%;
  }
  .auth-page::after {
    content: ''; position: absolute; width: 350px; height: 350px;
    background: radial-gradient(circle, rgba(245,166,35,0.04) 0%, transparent 70%);
    top: -150px; right: -150px; border-radius: 50%;
  }

  .auth-card {
    background: var(--white); border-radius: 24px; padding: 48px 40px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03);
    border: 1px solid var(--border); position: relative; z-index: 1;
    animation: slideUp 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .auth-icon {
    width: 56px; height: 56px; border-radius: 16px; background: var(--hover);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px; font-size: 24px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-8px); }
  }

  .auth-card h2 {
    font-size: 24px; font-weight: 750; color: var(--text);
    text-align: center; margin-bottom: 6px; letter-spacing: -0.5px;
  }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; line-height: 1.5; }
  .email-chip {
    display: block; text-align: center; color: var(--accent);
    font-weight: 650; font-size: 0.88rem; margin-bottom: 28px;
  }

  .input-group { margin-bottom: 16px; position: relative; }
  .input-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 18px; z-index: 1;
  }
  .input-group input {
    width: 100%; padding: 15px 48px 15px 48px;
    border: 2px solid var(--border); border-radius: 14px; font-size: 0.95rem;
    transition: all 0.3s ease; background: var(--card); color: var(--text);
    font-weight: 500; font-family: 'Inter', sans-serif; outline: none;
  }
  .input-group input:focus {
    border-color: var(--accent); background: var(--white);
    box-shadow: 0 0 0 4px rgba(224,123,57,0.08);
  }
  .input-group input::placeholder { color: #c4b8a8; font-weight: 400; }

  .toggle-pw {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    cursor: pointer; font-size: 18px; user-select: none;
  }

  .password-hint { font-size: 0.78rem; color: var(--muted); margin: -4px 0 12px 4px; }

  .strength-bar { height: 4px; border-radius: 4px; background: var(--border); margin: -4px 0 14px; overflow: hidden; }
  .strength-fill { height: 100%; width: 0; border-radius: 4px; transition: width .3s, background .3s; }

  .match-hint { font-size: 0.78rem; margin: -4px 0 14px 4px; min-height: 18px; }

  .btn-signup {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white; border: none; border-radius: 14px;
    font-size: 1rem; font-weight: 650; cursor: pointer;
    transition: all 0.3s ease; margin-top: 4px;
    box-shadow: 0 6px 20px rgba(224,123,57,0.25);
    letter-spacing: 0.3px; font-family: 'Inter', sans-serif;
  }
  .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(224,123,57,0.35); }
  .btn-signup:active { transform: translateY(0); }

  .features-row {
    display: flex; justify-content: center; gap: 30px;
    margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--border);
  }
  .feature-mini { text-align: center; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .feature-mini .fi { display: block; font-size: 22px; margin-bottom: 4px; }

  @media (max-width: 480px) {
    .auth-card { padding: 32px 20px; }
    .features-row { gap: 16px; }
  }
</style>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-icon">✨</div>
    <h2>Almost there!</h2>
    <p class="subtitle">Email verified for</p>
    <span class="email-chip">{{ email }}</span>

    <form method="POST" action="{{ url_for('auth.complete_signup') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="input-group">
        <span class="input-icon">👤</span>
        <input type="text" name="name" placeholder="What should we call you?" required autofocus>
      </div>

      <div class="input-group">
        <span class="input-icon">🔐</span>
        <input type="password" id="pw" name="password" placeholder="Create a strong password" required>
        <span class="toggle-pw" onclick="togglePw('pw', this)">👁️</span>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="password-hint">✦ At least 7 characters with 1 special character</div>

      <div class="input-group">
        <span class="input-icon">🔐</span>
        <input type="password" id="pw2" name="confirm" placeholder="Confirm your password" required>
        <span class="toggle-pw" onclick="togglePw('pw2', this)">👁️</span>
      </div>
      <div id="matchHint" class="match-hint"></div>

      <button type="submit" class="btn-signup">Create account ✦</button>
    </form>

    <div class="features-row">
      <div class="feature-mini"><span class="fi">📋</span> Tasks</div>
      <div class="feature-mini"><span class="fi">🎯</span> Habits</div>
      <div class="feature-mini"><span class="fi">🍅</span> Focus</div>
      <div class="feature-mini"><span class="fi">🐾</span> Pet</div>
    </div>
  </div>
</div>

<script>
function togglePw(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
}

const pw   = document.getElementById('pw');
const pw2  = document.getElementById('pw2');
const fill = document.getElementById('strengthFill');
const matchHint = document.getElementById('matchHint');

pw.addEventListener('input', () => {
  const v = pw.value;
  let score = 0;
  if (v.length >= 7)  score++;
  if (v.length >= 12) score++;
  if (/[!@#$%^&*(),.?\":{}|<>]/.test(v)) score++;
  if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
  const colours = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
  fill.style.width      = (score * 25) + '%';
  fill.style.background = colours[score - 1] || '#F0E8DF';
  checkMatch();
});

pw2.addEventListener('input', checkMatch);

function checkMatch() {
  if (!pw2.value) { matchHint.textContent = ''; return; }
  if (pw.value === pw2.value) {
    matchHint.textContent = '✓ Passwords match';
    matchHint.style.color = '#22c55e';
  } else {
    matchHint.textContent = '✗ Passwords do not match';
    matchHint.style.color = '#ef4444';
  }
}
</script>

{% endblock %}
