{% extends "base.html" %}
{% block title %}Study Setup · monad{% endblock %}
{% block page_title %}study{% endblock %}

{% block content %}
<style>
  @keyframes fadeUp   { from{opacity:0;transform:translateY(22px)} to{opacity:1;transform:translateY(0)} }
  @keyframes floatIn  { from{opacity:0;transform:translateY(30px) scale(.97)} to{opacity:1;transform:translateY(0) scale(1)} }

  .setup-wrap {
    max-width: 520px; margin: 0 auto; padding: 16px 0 80px;
    animation: fadeUp .5s ease both;
  }

  /* ── Hero ── */
  .su-hero {
    text-align: center; margin-bottom: 32px;
    animation: fadeUp .4s ease .05s both;
  }
  .su-icon {
    width: 72px; height: 72px; border-radius: 8px; margin: 0 auto 16px;
    background: var(--accent-1);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
    border: 3px solid var(--text-primary); box-shadow: 4px 4px 0 var(--text-primary);
  }
  .su-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.7rem; font-weight: 800; color: var(--text-primary); margin-bottom: 8px;
    text-transform: uppercase;
  }
  .su-sub {
    font-size: .9rem; color: var(--text-secondary); line-height: 1.5;
  }

  /* ── Card ── */
  .su-card {
    background: var(--card-bg); border: 3px solid var(--text-primary);
    border-radius: 8px; padding: 28px;
    box-shadow: 4px 4px 0 var(--text-primary);
    animation: floatIn .5s ease .1s both;
  }

  /* ── Type toggle ── */
  .su-type-row {
    display: flex; gap: 8px; margin-bottom: 22px;
  }
  .su-type-btn {
    flex: 1; padding: 10px 0; border-radius: 6px; font-size: .82rem; font-weight: 800;
    border: 2px solid var(--text-primary); background: var(--hover);
    color: var(--text-secondary); cursor: pointer; transition: all .18s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 3px 3px 0 var(--text-primary);
    font-family: 'Space Grotesk', sans-serif; text-transform: uppercase;
  }
  .su-type-btn.active {
    background: var(--accent-1); color: white; border-color: var(--text-primary);
    box-shadow: 3px 3px 0 var(--text-primary);
  }
  .su-type-btn:hover { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--text-primary); }

  /* ── Fields ── */
  .su-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .su-field { display: flex; flex-direction: column; gap: 5px; }
  .su-field.full { grid-column: 1 / -1; }
  .su-label {
    font-size: .72rem; font-weight: 800; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: .5px; font-family: 'Space Grotesk', sans-serif;
  }
  .su-input {
    padding: 10px 14px; border-radius: 6px;
    border: 2px solid var(--text-primary); background: var(--hover);
    color: var(--text-primary); font-size: .88rem; font-family: 'Inter', sans-serif;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .su-input:focus { border-color: var(--accent-1); box-shadow: 3px 3px 0 var(--accent-1); }
  .su-input::placeholder { color: var(--text-secondary); }

  /* ── CTA ── */
  .su-cta {
    margin-top: 24px; width: 100%; padding: 14px;
    background: var(--accent-1);
    color: white; border: 2px solid var(--text-primary); border-radius: 6px;
    font-family: 'Space Grotesk', sans-serif; font-size: 1rem; font-weight: 800;
    cursor: pointer; transition: all .2s;
    box-shadow: 4px 4px 0 var(--text-primary);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-transform: uppercase;
  }
  .su-cta:hover { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--text-primary); }
  .su-cta:active { box-shadow: none; transform: translate(4px,4px); }

  /* ── Skip link ── */
  .su-skip {
    display: block; text-align: center; margin-top: 14px;
    font-size: .8rem; color: var(--text-secondary);
    text-decoration: none; transition: color .15s; font-weight: 700;
  }
  .su-skip:hover { color: var(--text-primary); }

  @media (max-width: 560px) {
    .su-grid { grid-template-columns: 1fr; }
    .su-card  { padding: 20px; }
  }
</style>

<div class="setup-wrap">

  <!-- Hero -->
  <div class="su-hero">
    <div class="su-icon"><i class="bi bi-mortarboard-fill"></i></div>
    <div class="su-title">Set up your study profile</div>
    <div class="su-sub">Tell Monad about your academic life<br>so it can personalise your study hub.</div>
  </div>

  <!-- Form card -->
  <div class="su-card">
    <form method="POST" action="{{ url_for('views.study_setup_save') }}"
          id="setupForm" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Photo upload -->
      <div class="su-field full" style="margin-bottom:22px;text-align:center">
        <label class="su-label" style="display:block;margin-bottom:10px">
          Student ID Photo <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span>
        </label>
        <div id="photoPreviewWrap"
             style="width:90px;height:90px;border-radius:50%;border:2px dashed var(--border-color);
                    margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
                    overflow:hidden;cursor:pointer;background:var(--hover);transition:border-color .2s"
             onclick="document.getElementById('photoInput').click()">
          <img id="photoPreview" src="" alt=""
               style="width:100%;height:100%;object-fit:cover;display:none">
          <span id="photoPlaceholder" style="font-size:1.8rem"><i class="bi bi-camera-fill"></i></span>
        </div>
        <input type="file" id="photoInput" name="photo" accept="image/*"
               style="display:none" onchange="previewPhoto(this)">
        <button type="button" onclick="document.getElementById('photoInput').click()"
                style="font-size:.78rem;color:var(--accent-1);background:none;border:none;
                       cursor:pointer;font-family:'Inter',sans-serif;font-weight:600">
          Choose photo
        </button>
      </div>

      <!-- Institution type -->
      <div class="su-type-row">
        <button type="button" class="su-type-btn active" id="btnSchool" onclick="switchType('school')">
          <i class="bi bi-building-fill"></i> School
        </button>
        <button type="button" class="su-type-btn" id="btnCollege" onclick="switchType('college')">
          <i class="bi bi-mortarboard-fill"></i> College / University
        </button>
      </div>
      <input type="hidden" name="institution_type" id="fType" value="school">

      <div class="su-grid">

        <!-- Institution name -->
        <div class="su-field full">
          <label class="su-label" id="lInst">School Name</label>
          <input class="su-input" name="institution" id="fInst"
                 placeholder="e.g. St. Mary's Higher Secondary School" autocomplete="off">
        </div>

        <!-- Course / Stream -->
        <div class="su-field full">
          <label class="su-label" id="lCourse">Course / Stream</label>
          <input class="su-input" name="course" id="fCourse"
                 placeholder="e.g. Science Stream, B.Tech CSE">
        </div>

        <!-- School fields -->
        <div class="su-field su-school" id="fClassWrap">
          <label class="su-label">Class</label>
          <input class="su-input" name="class_name" placeholder="e.g. 10th, 11th, 12th">
        </div>
        <div class="su-field su-school" id="fSectionWrap">
          <label class="su-label">Section</label>
          <input class="su-input" name="section" placeholder="e.g. A, B, C">
        </div>

        <!-- College fields -->
        <div class="su-field su-college" id="fDeptWrap" style="display:none">
          <label class="su-label">Department</label>
          <input class="su-input" name="department" placeholder="e.g. Computer Science">
        </div>
        <div class="su-field su-college" id="fYearWrap" style="display:none">
          <label class="su-label">Year</label>
          <input class="su-input" name="year" placeholder="e.g. 2nd Year">
        </div>
        <div class="su-field su-college full" id="fSemWrap" style="display:none">
          <label class="su-label">Semester</label>
          <input class="su-input" name="semester" placeholder="e.g. 4th Semester">
        </div>

        <!-- Roll number -->
        <div class="su-field full">
          <label class="su-label">Roll Number / Student ID <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
          <input class="su-input" name="roll_number" placeholder="e.g. CS2024001">
        </div>

      </div>

      <button type="submit" class="su-cta">
        Let's go
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>
  </div>

  <a class="su-skip" href="{{ url_for('views.study_subjects') }}?skip=1">Skip for now →</a>

</div>

<script>
function previewPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('photoPreview').src = e.target.result;
    document.getElementById('photoPreview').style.display = 'block';
    document.getElementById('photoPlaceholder').style.display = 'none';
    document.getElementById('photoPreviewWrap').style.borderStyle = 'solid';
    document.getElementById('photoPreviewWrap').style.borderColor = 'var(--accent-1)';
  };
  reader.readAsDataURL(file);
}

function switchType(type) {
  document.getElementById('fType').value = type;
  const isCollege = type === 'college';
  document.getElementById('btnSchool').classList.toggle('active', !isCollege);
  document.getElementById('btnCollege').classList.toggle('active', isCollege);
  document.querySelectorAll('.su-school').forEach(el => el.style.display = isCollege ? 'none' : '');
  document.querySelectorAll('.su-college').forEach(el => el.style.display = isCollege ? '' : 'none');
  document.getElementById('lInst').textContent   = isCollege ? 'College / University Name' : 'School Name';
  document.getElementById('lCourse').textContent = isCollege ? 'Course / Program' : 'Course / Stream';
  document.getElementById('fInst').placeholder   = isCollege ? 'e.g. Anna University' : "e.g. St. Mary's Higher Secondary School";
  document.getElementById('fCourse').placeholder = isCollege ? 'e.g. B.Tech Computer Science' : 'e.g. Science Stream, Commerce';
}
</script>
{% endblock %}
